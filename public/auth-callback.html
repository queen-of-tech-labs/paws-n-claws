<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in — Paws & Claws</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #94a3b8; font-size: 15px; }
    .error { color: #f87171; font-size: 14px; max-width: 300px; text-align: center; }
    .open-btn {
      margin-top: 12px;
      padding: 12px 24px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Signing you in…</p>
  <p class="error" id="error" style="display:none"></p>
  <button class="open-btn" id="openBtn" onclick="openApp()">Open Paws & Claws App</button>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, isSignInWithEmailLink, signInWithEmailLink } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey:            "__FIREBASE_API_KEY__",
      authDomain:        "paws-n-claws.vercel.app",
      projectId:         "__FIREBASE_PROJECT_ID__",
      storageBucket:     "__FIREBASE_STORAGE_BUCKET__",
      messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
      appId:             "__FIREBASE_APP_ID__"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function getParam(name) {
      // Check query string
      const url = new URL(window.location.href);
      const val = url.searchParams.get(name);
      if (val) return val;
      // Check hash query string (for HashRouter links)
      const hash = window.location.hash;
      if (hash.includes('?')) {
        const hashParams = new URLSearchParams(hash.split('?')[1]);
        return hashParams.get(name);
      }
      return null;
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = msg;
      document.getElementById('openBtn').style.display = 'block';
    }

    window.openApp = function() {
      window.location.href = 'pawsclaws://login';
    };

    async function handleSignIn() {
      const currentUrl = window.location.href;

      if (!isSignInWithEmailLink(auth, currentUrl)) {
        showError('This link has expired or is invalid. Please request a new magic link.');
        return;
      }

      // Get email — embedded in URL, or from localStorage
      let email = getParam('email')
        || localStorage.getItem('emailForSignIn')
        || sessionStorage.getItem('emailForSignIn');

      if (!email) {
        // Prompt as last resort — only happens if user opens on different device
        email = window.prompt('Please enter your email address to confirm sign-in:');
        if (!email) { showError('Email required to complete sign-in.'); return; }
      }

      try {
        const result = await signInWithEmailLink(auth, email, currentUrl);
        const idToken = await result.user.getIdToken();

        // Store the token and email so the app can pick them up
        localStorage.setItem('emailForSignIn', email);
        localStorage.setItem('pendingAuthToken', idToken);
        localStorage.setItem('pendingAuthEmail', email);
        localStorage.removeItem('emailForSignIn');

        document.getElementById('msg').textContent = 'Sign-in successful! Opening app…';

        // Try to open the app via custom scheme
        window.location.href = 'pawsclaws://login?token=' + encodeURIComponent(idToken) + '&email=' + encodeURIComponent(email);

        // Fallback: if still in browser after 2s, redirect to the web app
        setTimeout(() => {
          window.location.href = 'https://paws-n-claws.vercel.app/#/dashboard';
        }, 2000);

      } catch (err) {
        console.error('Sign-in error:', err);
        showError('Sign-in failed: ' + err.message);
      }
    }

    handleSignIn();
  </script>
</body>
</html>
