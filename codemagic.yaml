workflows:
  ios-release:
    name: Paws & Claws iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Royalty Tech Labs API Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.royaltytechlabs.pawsclaws
      vars:
        BUNDLE_ID: "com.royaltytechlabs.pawsclaws"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: v22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -derivedDataPath ios/App/build
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true